services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: siteiq
      POSTGRES_PASSWORD: siteiq_dev_password
      POSTGRES_DB: siteiq
    ports:
      - "5432:5432"
    volumes:
      - siteiq_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siteiq"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  siteiq_pg_data:
